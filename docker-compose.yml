services:
  core-project-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-project-service
    environment:
      # DB
      DATABASE_URL: "postgresql://user:password@postgres:5432/visiobook_core_project?schema=public"
      MONGODB_URL: "mongodb://mongodb:27017/visiobook_core_project"
      REDIS_URL: "redis://redis:6379"
      QUEUE_REDIS_URL: "redis://redis:6379"

      # Services externes (mock ou non critiques pour /health)
      USER_SERVICE_URL: "http://localhost:8081"
      STORAGE_SERVICE_URL: "http://localhost:8089"
      AI_SERVICE_URL: "http://localhost:8083"

      # Application
      NODE_ENV: "development"
      PORT: "8086"

      # Sécurité (valeurs de dev)
      JWT_SECRET: "your-jwt-secret-change-in-production"
      ENCRYPTION_KEY: "your-encryption-key-change-in-production"

      # Monitoring
      LOG_LEVEL: "info"

      # Storage Service Mock
      STORAGE_SERVICE_MOCK: "true"

      # Workflow / Queue (si utilisé)
      QUEUE_CONCURRENCY: "5"
      QUEUE_RETRY_ATTEMPTS: "3"
      QUEUE_RETRY_DELAY: "5000"
      MAX_WORKFLOW_DURATION: "3600"
      WORKFLOW_CLEANUP_INTERVAL: "86400"
      AUTO_SAVE_INTERVAL: "30000"

    depends_on:
      - postgres
      - mongodb
      - redis
    ports:
      - "8086:8086"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: core-project-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: visiobook_core_project
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: core-project-mongo
    environment:
      MONGO_INITDB_DATABASE: visiobook_core_project
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: core-project-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  redis-data:


