version: "3.9"

services:
  core-project-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-project-service
    env_file:
      - .env
    environment:
      # On écrase les localhost du .env pour utiliser les noms de services Docker
      DATABASE_URL: "postgresql://user:password@postgres:5432/visiobook_core_project?schema=public"
      MONGODB_URL: "mongodb://mongodb:27017/visiobook_core_project"
      REDIS_URL: "redis://redis:6379"
      QUEUE_REDIS_URL: "redis://redis:6379"
    depends_on:
      - postgres
      - mongodb
      - redis
    ports:
      - "8086:8086"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: core-project-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: visiobook_core_project
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: core-project-mongo
    environment:
      MONGO_INITDB_DATABASE: visiobook_core_project
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: core-project-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  redis-data:
