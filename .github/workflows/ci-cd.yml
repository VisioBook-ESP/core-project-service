name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm i
      - run: npx prisma generate
      - run: npm run lint-ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [code-quality, test, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and start stack with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for /health (API + DBs)
        run: |
          set -e

          echo "⏳ Attente que l'API réponde sur /health..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8086/health > /dev/null; then
              echo "✅ /health OK"
              exit 0
            fi

            echo "… tentative $i/30, l'application n'est pas encore prête"
            sleep 2
          done

          echo "::error::❌ /health n'a pas répondu correctement dans le temps imparti"
          echo "Logs des conteneurs :"
          docker compose ps
          docker compose logs core-project-service || true
          exit 1

      - name: Stop Docker Compose
        if: always()
        run: |
          docker compose down -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: [code-quality, test, build, docker-build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUBTOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/visiobook-esp/core-project-service-dev
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker Image
        run: |
          docker build -f Dockerfile -t ghcr.io/visiobook-esp/core-project-service-dev:latest .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/visiobook-esp/core-project-service-dev:latest


