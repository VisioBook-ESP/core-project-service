{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "core-project-service.fullname" . }}
  labels:
    {{- include "core-project-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ include "core-project-service.name" . }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
